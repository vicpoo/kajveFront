<section class="min-h-screen rounded-[40px] bg-[#F2E6D8] p-6 text-[#3D2212] shadow-[0_20px_60px_rgba(107,58,35,0.12)] sm:p-10">
  <div class="flex items-center justify-between gap-4">
    <div>
      <p class="text-sm uppercase tracking-[0.28em] text-[#7A3E24]/80">Osiles</p>
      <h1 class="mt-3 text-4xl font-semibold">Pedidos recientes</h1>
    </div>
    <button class="inline-flex items-center justify-center rounded-full bg-[#75341A] px-6 py-3 text-sm font-semibold text-[#F2E6D8] transition duration-200 hover:bg-[#5e2b16]">agregar pedido</button>
  </div>

  <div class="mt-8 overflow-hidden rounded-[32px] bg-white shadow-[0_20px_60px_rgba(107,58,35,0.12)] border border-[#D7BBA4]/80">
    <table class="min-w-full text-left text-sm text-[#3D2212]">
      <thead class="border-b border-[#D7BBA4]/80 bg-[#F8EEE2]">
        <tr>
          <th class="px-6 py-4">Clave</th>
          <th class="px-6 py-4">Usuario</th>
          <th class="px-6 py-4">Nombre</th>
          <th class="px-6 py-4">Fecha</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let osil of osiles" class="border-b border-[#D7BBA4]/80 hover:bg-[#F5E2D3]/70">
          <td class="px-6 py-4">{{ osil.clave }}</td>
          <td class="px-6 py-4">{{ osil.usuario }}</td>
          <td class="px-6 py-4">{{ osil.nombre }}</td>
          <td class="px-6 py-4">{{ osil.fecha }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</section>
