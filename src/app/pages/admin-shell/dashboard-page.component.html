<section class="min-h-screen rounded-[40px] bg-[#F2E6D8] p-6 text-[#3D2212] shadow-[0_20px_60px_rgba(107,58,35,0.12)] sm:p-10">
  <div class="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
    <div>
      <p class="text-sm uppercase tracking-[0.28em] text-[#7A3E24]/80">Dashboard</p>
      <h1 class="mt-3 text-4xl font-semibold">Panel de administración</h1>
    </div>
    <button class="inline-flex items-center justify-center rounded-full bg-[#75341A] px-6 py-3 text-sm font-semibold text-[#F2E6D8] transition duration-200 hover:bg-[#5e2b16]">descargar</button>
  </div>

  <div class="mt-8 grid gap-4 sm:grid-cols-3">
    <article *ngFor="let stat of stats" class="rounded-[28px] bg-white p-6 shadow-[0_20px_40px_rgba(107,58,35,0.12)] border border-[#D7BBA4]/80">
      <p class="text-sm uppercase tracking-[0.22em] text-[#7A3E24]/80">{{ stat.label }}</p>
      <p class="mt-4 text-3xl font-semibold text-[#3D2212]">{{ stat.value }}</p>
      <p class="mt-2 text-sm leading-6 text-[#5E3D2A]/85">{{ stat.sublabel }}</p>
    </article>
  </div>

  <div class="mt-10 grid gap-6 lg:grid-cols-[2fr_0.8fr]">
    <div class="rounded-[32px] bg-white p-6 shadow-[0_20px_60px_rgba(107,58,35,0.12)] border border-[#D7BBA4]/80">
      <div class="flex items-center justify-between">
        <h2 class="text-xl font-semibold text-[#3D2212]">Actividad semanal</h2>
        <span class="text-sm text-[#7A3E24]/80">Pedidos</span>
      </div>
      <div class="mt-8 space-y-4">
        <div class="flex h-48 items-end gap-4">
          <div *ngFor="let bar of chartBars" class="flex-1">
            <div class="mx-auto h-full w-full rounded-full bg-[#E3D2BC]" [style.height.%]="bar.value"></div>
            <p class="mt-3 text-center text-sm text-[#5E3D2A]">{{ bar.label }}</p>
          </div>
        </div>
      </div>
    </div>

    <div class="rounded-[32px] bg-[#FFFFFF]/95 p-6 shadow-[0_20px_60px_rgba(107,58,35,0.12)] border border-[#D7BBA4]/80">
      <h2 class="text-xl font-semibold text-[#3D2212]">Resumen rápido</h2>
      <p class="mt-4 text-sm leading-6 text-[#5E3D2A]/85">Revisa los números clave del día y comparte el estado de la plataforma con tu equipo.</p>
      <div class="mt-6 space-y-4">
        <div class="rounded-[24px] bg-[#F7E8DA] p-4">
          <p class="text-sm text-[#7A3E24]">Crecimiento de usuarios</p>
          <p class="mt-2 text-2xl font-semibold text-[#3D2212]">+8%</p>
        </div>
        <div class="rounded-[24px] bg-[#F7E8DA] p-4">
          <p class="text-sm text-[#7A3E24]">Usuarios premium</p>
          <p class="mt-2 text-2xl font-semibold text-[#3D2212]">120</p>
        </div>
      </div>
    </div>
  </div>
</section>
