<!-- admin-shell.component.html -->
<div class="min-h-screen bg-[#F2E6D8] text-[#3D2212]">
  <div class="grid min-h-screen grid-cols-[280px_1fr]">
    <aside class="border-r border-[#D7BBA4]/80 bg-[#75341A] px-6 py-8 text-[#F2E6D8]">
      <div class="flex flex-col gap-4 h-full">
        <div class="flex items-center gap-3 rounded-full bg-[#8A593E]/10 px-4 py-3">
          <div class="h-12 w-12 rounded-full bg-[#F2E6D8] text-center leading-12 text-xl font-bold text-[#7A3E24]">K</div>
          <div>
            <p class="text-sm font-semibold uppercase tracking-[0.22em]">kajve</p>
            <p class="text-xs text-[#E9D9C7]">{{ userName }}</p>
          </div>
        </div>

        <nav class="mt-8 space-y-2 text-sm font-medium flex-1">
          <a routerLink="/admin/dashboard" class="flex items-center gap-3 rounded-3xl px-4 py-3 transition hover:bg-[#8A593E]/10" routerLinkActive="bg-[#8A593E]/10">Dashboard</a>
          <a routerLink="/admin/osiles" class="flex items-center gap-3 rounded-3xl px-4 py-3 transition hover:bg-[#8A593E]/10" routerLinkActive="bg-[#8A593E]/10">Osiles</a>
          <a routerLink="/admin/usuarios" class="flex items-center gap-3 rounded-3xl px-4 py-3 transition hover:bg-[#8A593E]/10" routerLinkActive="bg-[#8A593E]/10">Usuarios</a>
          <a routerLink="/admin/estadisticas" class="flex items-center gap-3 rounded-3xl px-4 py-3 transition hover:bg-[#8A593E]/10" routerLinkActive="bg-[#8A593E]/10">Estadísticas</a>
        </nav>

        <div class="pt-4 border-t border-[#8A593E]/20">
          <button 
            (click)="logout()" 
            class="inline-flex items-center gap-3 rounded-full border border-[#E9D9C7]/30 bg-[#8A593E]/10 px-4 py-3 text-sm text-[#F2E6D8] transition hover:bg-[#8A593E]/20 w-full"
          >
            Salir
          </button>
        </div>
      </div>
    </aside>

    <main class="p-8">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
