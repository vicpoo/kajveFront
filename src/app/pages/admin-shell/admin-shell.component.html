<div class="min-h-screen bg-[#F2E6D8] text-[#3D2212]">
  <div class="grid min-h-screen grid-cols-[280px_1fr]">

    <!-- Sidebar -->
    <aside class="border-r border-[#D7BBA4]/80 bg-[#75341A] px-6 py-8 text-[#F2E6D8]">
      <div class="flex flex-col h-full gap-4">

        <!-- Usuario -->
        <div class="flex items-center gap-3 rounded-full bg-[#8A593E]/10 px-4 py-3">
          <div class="h-12 w-12 rounded-full bg-[#F2E6D8] text-center leading-12 text-xl font-bold text-[#7A3E24]">
            K
          </div>

          <div>
            <p class="text-sm font-semibold uppercase tracking-[0.22em]">
              kajve
            </p>
            <p class="text-xs text-[#E9D9C7]">
              {{ userName }}
            </p>
          </div>
        </div>

        <!-- Menú -->
        <nav class="mt-8 space-y-2 text-sm font-medium flex-1">
          <a
            routerLink="/admin/dashboard"
            routerLinkActive="bg-[#8A593E]/10"
            class="flex items-center gap-3 rounded-3xl px-4 py-3 transition hover:bg-[#8A593E]/10"
          >
            Dashboard
          </a>

          <a
            routerLink="/admin/osiles"
            routerLinkActive="bg-[#8A593E]/10"
            class="flex items-center gap-3 rounded-3xl px-4 py-3 transition hover:bg-[#8A593E]/10"
          >
            Osiles
          </a>

          <a
            routerLink="/admin/usuarios"
            routerLinkActive="bg-[#8A593E]/10"
            class="flex items-center gap-3 rounded-3xl px-4 py-3 transition hover:bg-[#8A593E]/10"
          >
            Usuarios
          </a>

          <a
            routerLink="/admin/estadisticas"
            routerLinkActive="bg-[#8A593E]/10"
            class="flex items-center gap-3 rounded-3xl px-4 py-3 transition hover:bg-[#8A593E]/10"
          >
            Estadísticas
          </a>

          <a
            routerLink="/admin/sensores"
            routerLinkActive="bg-[#8A593E]/10"
            class="flex items-center gap-3 rounded-3xl px-4 py-3 transition hover:bg-[#8A593E]/10"
          >
            Sensores
          </a>
        </nav>

        <!-- Botón Salir (siempre al final) -->
        <div class="mt-auto pt-4">
          <button
            (click)="logout()"
            class="inline-flex items-center justify-center gap-3 w-full rounded-full border border-[#E9D9C7]/30 bg-[#8A593E]/10 px-4 py-3 text-sm text-[#F2E6D8] transition hover:bg-[#8A593E]/20 hover:shadow-lg hover:scale-[1.02] active:scale-[0.98]"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
              ></path>
            </svg>

            Salir
          </button>
        </div>

      </div>
    </aside>

    <!-- Contenido -->
    <main class="p-8 overflow-y-auto h-screen">
      <router-outlet></router-outlet>
    </main>

  </div>
</div>
