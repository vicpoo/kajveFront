<!-- stats-page.component.html -->
<section class="min-h-screen rounded-[40px] bg-[#F2E6D8] p-6 text-[#3D2212] shadow-[0_20px_60px_rgba(107,58,35,0.12)] sm:p-10">
  <div class="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
    <div>
      <p class="text-sm uppercase tracking-[0.28em] text-[#7A3E24]/80">Estadísticas</p>
      <h1 class="mt-3 text-4xl font-semibold">Datos clave</h1>
    </div>
    <button class="inline-flex items-center justify-center rounded-full bg-[#75341A] px-6 py-3 text-sm font-semibold text-[#F2E6D8] transition duration-200 hover:bg-[#5e2b16]">descargar</button>
  </div>

  <div class="mt-8 grid gap-6 lg:grid-cols-3">
    <div *ngFor="let stat of stats()" class="rounded-[32px] bg-white p-6 shadow-[0_20px_60px_rgba(107,58,35,0.12)] border border-[#D7BBA4]/80">
      <p class="text-sm uppercase tracking-[0.22em] text-[#7A3E24]/80">{{ stat.label }}</p>
      <p class="mt-4 text-3xl font-semibold text-[#3D2212]">{{ stat.value }}</p>
    </div>
  </div>

  <div class="mt-10 grid gap-6 lg:grid-cols-[1.2fr_0.8fr]">
    <div class="rounded-[32px] bg-white p-6 shadow-[0_20px_60px_rgba(107,58,35,0.12)] border border-[#D7BBA4]/80">
      <h2 class="text-xl font-semibold text-[#3D2212]">Gráfica de crecimiento</h2>
      <div class="mt-8 h-60 rounded-[32px] bg-[#F8EEE2]"></div>
    </div>
    <div class="rounded-[32px] bg-white p-6 shadow-[0_20px_60px_rgba(107,58,35,0.12)] border border-[#D7BBA4]/80">
      <h2 class="text-xl font-semibold text-[#3D2212]">Acciones</h2>
      <div class="mt-6 space-y-4 text-sm leading-6 text-[#5E3D2A]/85">
        <p>Descarga informes con un clic.</p>
        <p>Observa las métricas principales de tus usuarios y pedidos.</p>
      </div>
    </div>
  </div>
</section>
