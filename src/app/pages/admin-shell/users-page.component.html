<section class="min-h-screen rounded-[40px] bg-[#F2E6D8] p-6 text-[#3D2212] shadow-[0_20px_60px_rgba(107,58,35,0.12)] sm:p-10">
  <div class="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
    <div>
      <p class="text-sm uppercase tracking-[0.28em] text-[#7A3E24]/80">Usuarios</p>
      <h1 class="mt-3 text-4xl font-semibold">Lista de usuarios</h1>
    </div>
    <button class="inline-flex items-center justify-center rounded-full bg-[#75341A] px-6 py-3 text-sm font-semibold text-[#F2E6D8] transition duration-200 hover:bg-[#5e2b16]">agregar admin</button>
  </div>

  <div class="mt-8 space-y-8">
    <div class="overflow-hidden rounded-[32px] bg-white shadow-[0_20px_60px_rgba(107,58,35,0.12)] border border-[#D7BBA4]/80">
      <table class="min-w-full text-left text-sm text-[#3D2212]">
        <thead class="border-b border-[#D7BBA4]/80 bg-[#F8EEE2]">
          <tr>
            <th class="px-6 py-4">Usuario</th>
            <th class="px-6 py-4">Email</th>
            <th class="px-6 py-4">Premium</th>
            <th class="px-6 py-4">Osiles</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let user of users" class="border-b border-[#D7BBA4]/80 hover:bg-[#F5E2D3]/70">
            <td class="px-6 py-4">{{ user.usuario }}</td>
            <td class="px-6 py-4">{{ user.email }}</td>
            <td class="px-6 py-4">{{ user.premium }}</td>
            <td class="px-6 py-4">{{ user.osiles }}</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="rounded-[32px] bg-white p-6 shadow-[0_20px_60px_rgba(107,58,35,0.12)] border border-[#D7BBA4]/80">
      <h2 class="text-xl font-semibold text-[#3D2212]">Administradores</h2>
      <div class="mt-6 overflow-hidden rounded-[28px] border border-[#D7BBA4]/80">
        <table class="min-w-full text-left text-sm text-[#3D2212]">
          <thead class="border-b border-[#D7BBA4]/80 bg-[#F8EEE2]">
            <tr>
              <th class="px-6 py-4">ID</th>
              <th class="px-6 py-4">Nombre</th>
              <th class="px-6 py-4">Rol</th>
              <th class="px-6 py-4">Email</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let admin of admins" class="border-b border-[#D7BBA4]/80 hover:bg-[#F5E2D3]/70">
              <td class="px-6 py-4">{{ admin.id }}</td>
              <td class="px-6 py-4">{{ admin.nombre }}</td>
              <td class="px-6 py-4">{{ admin.rol }}</td>
              <td class="px-6 py-4">{{ admin.email }}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</section>
