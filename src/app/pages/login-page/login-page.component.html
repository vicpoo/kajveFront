<!-- login-page.component.html -->
<main class="relative min-h-screen overflow-hidden bg-[#F2E6D8] text-[#2a1a14]">
  <div class="absolute inset-0">
    <div class="absolute inset-0 bg-[#75341A]" style="clip-path: polygon(0 0, 100% 0, 15% 100%, 0 100%);"></div>
    <div class="absolute inset-0 bg-[#F2E6D8]" style="clip-path: polygon(100% 0, 100% 100%, 15% 100%);"></div>
  </div>

  <div class="relative mx-auto flex min-h-screen items-center justify-center px-4 py-10 sm:px-6">
    <div class="relative w-full max-w-6xl overflow-hidden rounded-[42px] shadow-[0_35px_90px_rgba(0,0,0,0.15)]">
      <div class="relative grid min-h-[520px] md:grid-cols-[0.9fr_1.1fr]">
        <div class="relative flex items-center justify-center overflow-hidden bg-transparent p-8 sm:p-10">
          <div class="relative z-10 max-w-[360px] text-center">
            <div class="mx-auto flex h-36 w-36 items-center justify-center rounded-full bg-[#F2E6D8] text-[3rem] font-black text-[#75341A] shadow-[0_20px_40px_rgba(0,0,0,0.18)]">
              K
            </div>
            <p class="mt-8 text-sm uppercase tracking-[0.35em] text-[#F2E6D8]/80">Kajve</p>
            <h2 class="mt-4 text-4xl font-semibold text-[#F2E6D8]">Tu espacio</h2>
            <p class="mt-4 text-base leading-7 text-[#F2E6D8]/90">Panel café sólido con contraste crema en triángulos, inspirado en un diseño tipo Dublín.</p>
          </div>
        </div>

        <div class="relative flex items-center justify-center overflow-hidden bg-transparent p-8 sm:p-10">
          <div class="relative z-10 w-full max-w-md rounded-[34px] bg-[#F2E6D8] p-8 shadow-[0_20px_60px_rgba(117,52,26,0.16)] border border-[#75341A]/10">
            <div class="mb-10 text-center">
              <p class="text-sm font-semibold uppercase tracking-[0.25em] text-[#75341A]/70">Iniciar sesión</p>
              <h1 class="mt-3 text-3xl font-semibold text-[#75341A]">Accede a tu cuenta</h1>
            </div>

            <form class="space-y-8" (submit)="$event.preventDefault(); submit()">
              <div class="space-y-3">
                <label class="block text-sm font-medium text-[#75341A]">Email</label>
                <input
                  type="email"
                  [value]="email()"
                  (input)="email.set($any($event.target).value)"
                  placeholder="usuario@ejemplo.com"
                  class="w-full border-0 border-b-2 border-[#75341A]/30 bg-transparent pb-3 text-base text-[#2a1a14] outline-none placeholder:text-[#75341A]/40 focus:border-[#75341A] focus:ring-0"
                  [disabled]="isLoading()"
                />
              </div>

              <div class="space-y-3">
                <label class="block text-sm font-medium text-[#75341A]">Contraseña</label>
                <input
                  type="password"
                  [value]="password()"
                  (input)="password.set($any($event.target).value)"
                  placeholder="********"
                  class="w-full border-0 border-b-2 border-[#75341A]/30 bg-transparent pb-3 text-base text-[#2a1a14] outline-none placeholder:text-[#75341A]/40 focus:border-[#75341A] focus:ring-0"
                  [disabled]="isLoading()"
                />
              </div>

              <button
                type="submit"
                class="w-full rounded-full bg-[#75341A] px-6 py-3 text-base font-semibold text-[#F2E6D8] transition duration-200 hover:bg-[#5e2b16] disabled:opacity-50 disabled:cursor-not-allowed"
                [disabled]="isLoading()"
              >
                {{ isLoading() ? 'Cargando...' : 'Inicio de sesión' }}
              </button>
            </form>

            <div class="mt-4 rounded-[24px] border border-[#75341A]/10 p-4 text-sm" [ngClass]="{
                'text-[#1B3924] bg-[#E6F4E8] border-[#B2D9B8]': messageType() === 'success',
                'text-[#672525] bg-[#F8E2E2] border-[#E1B2B2]': messageType() === 'error',
                'text-[#5E3D2A] bg-[#FFF4E6] border-[#D7BBA4]': messageType() === 'info'
              }">
              {{ message() || 'Ingresa tus credenciales para acceder.' }}
            </div>

            <div class="mt-5 flex flex-col items-center gap-2 text-sm text-[#75341A]/80">
              <a href="/" class="underline decoration-[#75341A]/20 hover:text-[#75341A]">Volver al inicio</a>
              <a routerLink="/order" class="inline-flex items-center justify-center rounded-full bg-[#75341A] px-5 py-2 font-semibold text-[#F2E6D8] transition duration-200 hover:bg-[#5e2b16]">Comprar</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
