<!-- login-page.component.html -->
<main class="relative min-h-screen overflow-hidden bg-[#F2E6D8] text-[#2a1a14]">
  <!-- Triángulos decorativos -->
  <div class="absolute inset-0">
    <div class="absolute inset-0 bg-[#75341A]" style="clip-path: polygon(0 0, 100% 0, 15% 100%, 0 100%);"></div>
    <div class="absolute inset-0 bg-[#F2E6D8]" style="clip-path: polygon(100% 0, 100% 100%, 15% 100%);"></div>
  </div>

  <div class="relative mx-auto flex min-h-screen items-center justify-center px-4 py-10 sm:px-6">
    <div class="relative w-full max-w-6xl overflow-hidden rounded-[42px] shadow-[0_35px_90px_rgba(0,0,0,0.15)]">
      <div class="relative grid min-h-[520px] md:grid-cols-[0.9fr_1.1fr]">
        <!-- Lado izquierdo - Logo -->
        <div class="relative flex items-center justify-center overflow-hidden bg-transparent p-6 sm:p-10">
          <div class="relative z-10 flex flex-col items-center text-center max-w-[360px]">
            <!-- Logo circular más grande -->
            <img 
              src="assets/logo_kajve.jpeg" 
              alt="KAJVE Logo" 
              class="w-48 h-48 sm:w-56 sm:h-56 rounded-full object-cover shadow-[0_20px_40px_rgba(0,0,0,0.18)] ring-4 ring-[#F2E6D8]/50"
            />
            <h2 class="mt-6 text-5xl sm:text-6xl font-bold text-[#F2E6D8] tracking-tight">KAJVE</h2>
          </div>
        </div>

        <!-- Lado derecho - Formulario de login -->
        <div class="relative flex items-center justify-center overflow-hidden bg-transparent p-6 sm:p-10">
          <div class="relative z-10 w-full max-w-md rounded-[34px] bg-[#F2E6D8] p-6 sm:p-8 shadow-[0_20px_60px_rgba(117,52,26,0.16)] border border-[#75341A]/10">
            <div class="mb-8 text-center">
              <p class="text-sm font-semibold uppercase tracking-[0.25em] text-[#75341A]/70">Bienvenido</p>
              <h1 class="mt-3 text-3xl font-semibold text-[#75341A]">Iniciar sesión</h1>
            </div>

            <form class="space-y-6" (submit)="$event.preventDefault(); submit()">
              <div class="space-y-2">
                <label class="block text-sm font-medium text-[#75341A]">Email</label>
                <input
                  type="email"
                  [value]="email()"
                  (input)="email.set($any($event.target).value)"
                  placeholder="usuario@ejemplo.com"
                  class="w-full border-0 border-b-2 border-[#75341A]/30 bg-transparent pb-3 text-base text-[#2a1a14] outline-none placeholder:text-[#75341A]/40 focus:border-[#75341A] focus:ring-0 transition-colors"
                  [disabled]="isLoading()"
                />
              </div>

              <div class="space-y-2">
                <label class="block text-sm font-medium text-[#75341A]">Contraseña</label>
                <input
                  type="password"
                  [value]="password()"
                  (input)="password.set($any($event.target).value)"
                  placeholder="********"
                  class="w-full border-0 border-b-2 border-[#75341A]/30 bg-transparent pb-3 text-base text-[#2a1a14] outline-none placeholder:text-[#75341A]/40 focus:border-[#75341A] focus:ring-0 transition-colors"
                  [disabled]="isLoading()"
                />
              </div>

              <button
                type="submit"
                class="w-full rounded-full bg-[#75341A] px-6 py-3 text-base font-semibold text-[#F2E6D8] transition-all duration-200 hover:bg-[#5e2b16] hover:shadow-lg disabled:opacity-50 disabled:cursor-not-allowed"
                [disabled]="isLoading()"
              >
                {{ isLoading() ? 'Cargando...' : 'Inicio de sesión' }}
              </button>
            </form>

            <!-- Mensaje de estado -->
            <div *ngIf="message()" 
                 class="mt-4 rounded-[24px] border p-4 text-sm transition-all"
                 [ngClass]="{
                   'text-[#1B3924] bg-[#E6F4E8] border-[#B2D9B8]': messageType() === 'success',
                   'text-[#672525] bg-[#F8E2E2] border-[#E1B2B2]': messageType() === 'error',
                   'text-[#5E3D2A] bg-[#FFF4E6] border-[#D7BBA4]': messageType() === 'info'
                 }">
              {{ message() }}
            </div>

            <!-- Enlace volver al inicio -->
            <div class="mt-6 text-center">
              <a href="/" class="text-sm text-[#75341A]/70 hover:text-[#75341A] transition-colors underline decoration-[#75341A]/20 hover:decoration-[#75341A]/50">
                ← Volver al inicio
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
